<text x="40" y="49" font-size="30" fill="#172b3a" text-anchor="start" font-weight="bold">Full schematic - power, Pico header and INA226 logic</text>
<text x="40" y="81" font-size="18" fill="#526674" text-anchor="start" font-weight="normal">Battery negative, LM358 V- and Pico GND are common. K1 switches the positive battery lead; it does not switch the DUT terminals.</text>
<rect x="35" y="115" width="565" height="500" rx="7" fill="#f5f8f8" stroke="#cbd7db" stroke-width="1.3"/>
<text x="55" y="147" font-size="21" fill="#172b3a" text-anchor="start" font-weight="bold">USB-powered Pico and source reference</text>
<text x="65" y="210" font-size="23" fill="#172b3a" text-anchor="start" font-weight="bold">A1.36  3V3(OUT)</text>
<polyline class="wire" points="65,245 545,245"/>
<text x="65" y="280" font-size="20" fill="#236b69" text-anchor="start" font-weight="bold">+3V3_VS -&gt; J1.3 S, R13.1</text>
<text x="65" y="330" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Also feeds INA226 logic and K1 module.</text>
<text x="65" y="362" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Source on pin 36 / 3V3: user confirmed.</text>
<text x="65" y="394" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">VS = nominal 3.3 V, measured relative to GND.</text>
<text x="65" y="426" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Use measured VS for both VDS and VGS.</text>
<text x="65" y="458" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">A1.39 VSYS: no scanner connection.</text>
<text x="65" y="490" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">A1.40 VBUS: no scanner connection.</text>
<text x="65" y="522" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">USB still powers the Pico / Plus UI normally.</text>
<text x="65" y="554" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">No onboard ADC3 source readback is used.</text>
<rect x="630" y="115" width="755" height="500" rx="7" fill="#f5f8f8" stroke="#cbd7db" stroke-width="1.3"/>
<text x="650" y="147" font-size="21" fill="#172b3a" text-anchor="start" font-weight="bold">Two series batteries and NO power contact</text>
