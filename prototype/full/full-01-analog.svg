<text x="70" y="500" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">10uF ceramic preferred; if polarized: pin 1 = +.</text>
<text x="70" y="532" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">Ideal Vdrain = VS + 6.8 x PWMavg.</text>
<text x="70" y="564" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">RC = (1k || 6.8k) x 10uF = 8.72 ms nominal.</text>
<text x="70" y="596" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">R1 tolerance can place the zero-drive floor above/below VS.</text>
<text x="1220" y="445" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">VBUS pin 8 and IN+ pin 10 are BEFORE the shunt.</text>
<text x="1220" y="478" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">IN- pin 9 is on the DUT side. Use Kelvin sense wires.</text>
<text x="1220" y="511" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">VD = VBUS_D - VSH_D; subtract VS for VDS.</text>
<text x="1220" y="544" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">Remove the original R100 shunt; do not parallel it.</text>
<text x="1220" y="577" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">Current scale: 0.789 ohm; subtract open baseline.</text>
