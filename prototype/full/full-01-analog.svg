<text x="70" y="1160" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">10uF ceramic preferred; if polarized: pin 1 = +.</text>
<text x="70" y="1192" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">Vgate = 7.8 x average PWM voltage.</text>
<text x="70" y="1224" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">RC = 10 ms; R6 unchanged, not remeasured.</text>
<text x="70" y="1256" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">VGS = Vgate - VS; zero PWM gives about -3.3 V.</text>
<text x="1220" y="1105" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">VBUS pin 8 and IN+ pin 10 are BEFORE the shunt.</text>
<text x="1220" y="1138" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">IN- pin 9 is on the DUT side. Use Kelvin sense wires.</text>
<text x="1220" y="1171" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">VG = VBUS_G - VSH_G; subtract VS for VGS.</text>
<text x="1220" y="1204" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">Remove the original R100 shunt; do not parallel it.</text>
<text x="1220" y="1237" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">Current scale: provisional 638 ohm; subtract baseline.</text>
<text x="45" y="1340" font-size="18" fill="#a95018" text-anchor="start" font-weight="normal">INA226 numbers are IC pins, not breakout-header positions. J1 pins 1/2/3 = D/G/S are our fixture assignment, not a MOSFET package pinout.</text>
<polyline class="wire" points="40,1354 1960,1354"/>
<text x="40" y="1384" font-size="18" fill="#526674" text-anchor="start" font-weight="normal">Pocket MOSFET scanner | G | Docs 2026-11-03 | C5 fitted; C6 unconfirmed | Recalibrate after hardware / supply changes</text>
