<text x="733" y="251" font-size="17" fill="#172b3a" text-anchor="start" font-weight="normal"></text>
<text x="655" y="355" font-size="17" fill="#172b3a" text-anchor="start" font-weight="normal">C5 100nF / 50V</text>
<text x="345" y="410" font-size="21" fill="#172b3a" text-anchor="start" font-weight="bold">U1.4 V- -&gt; GND</text>
<text x="65" y="570" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">Battery stack spans nominal 18 V above GND.</text>
<text x="65" y="603" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">K1 interrupts only the positive battery lead.</text>
<text x="65" y="636" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">No battery connection to Pico VBUS or VSYS.</text>
<text x="65" y="669" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">C5 fitted at U1 pins 8 / 4; C6 fitting unconfirmed.</text>
<rect x="810" y="110" width="760" height="625" rx="7" fill="#f5f8f8" stroke="#cbd7db" stroke-width="1.3"/>
<text x="830" y="142" font-size="21" fill="#172b3a" text-anchor="start" font-weight="bold">K1 relay module and shared source reference</text>
<text x="840" y="185" font-size="21" fill="#172b3a" text-anchor="start" font-weight="bold">Pico 3V3(OUT) / physical pin 36</text>
<polyline class="wire" points="840,215 1510,215"/>
