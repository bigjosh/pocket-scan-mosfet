<text x="1340" y="278" font-size="20" fill="#172b3a" text-anchor="start" font-weight="bold">DUT S / VS</text>
<polyline class="wire" points="1500,215 1500,440"/>
<circle cx="1500" cy="215" r="4" fill="#236b69"/>
<text x="1235" y="475" font-size="19" fill="#172b3a" text-anchor="start" font-weight="normal">3V3 -&gt; R13 -&gt; U1.3 IN1+</text>
<text x="840" y="535" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">External module terminals: use printed labels, not header order.</text>
<text x="840" y="567" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">VCC and ACTIVATE are tied together on the 3.3 V rail.</text>
<text x="840" y="599" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Module current / internal driver / suppression are unverified.</text>
<text x="840" y="631" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Stays activated during soft reset; no GPIO controls it.</text>
<text x="840" y="663" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Source and R13 share 3.3 V; source connection confirmed.</text>
<rect x="30" y="765" width="1540" height="275" rx="7" fill="#f5f8f8" stroke="#cbd7db" stroke-width="1.3"/>
<text x="50" y="797" font-size="21" fill="#172b3a" text-anchor="start" font-weight="bold">Readback - current baseline and actual terminal voltages</text>
<text x="60" y="833" font-size="21" fill="#172b3a" text-anchor="start" font-weight="bold">INA_D - address 0x44</text>
<text x="60" y="875" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">VBUS = D_DRV; IN+ = D_DRV</text>
<text x="60" y="906" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">IN- = DUT D; shunt nominal 1 ohm</text>
<text x="60" y="937" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Id = (VSH_D - baseline_D) / 0.789</text>
<text x="60" y="968" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">VD = VBUS_D - raw VSH_D</text>
<text x="570" y="833" font-size="21" fill="#172b3a" text-anchor="start" font-weight="bold">INA_G - address 0x41</text>
<text x="570" y="875" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">VBUS = G_DRV; IN+ = G_DRV</text>
<text x="570" y="906" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">IN- = DUT G; shunt nominal 680 ohm</text>
<text x="570" y="937" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Ig = (VSH_G - baseline_G) / 638</text>
<text x="570" y="968" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">VG = VBUS_G - raw VSH_G</text>
<text x="1080" y="833" font-size="21" fill="#172b3a" text-anchor="start" font-weight="bold">Source-relative measurements</text>
<text x="1080" y="875" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">VDS = VD - configured VS</text>
<text x="1080" y="906" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">VGS = VG - configured VS</text>
<text x="1080" y="937" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">VS = measured 3.3 V rail, entered manually</text>
<text x="1080" y="968" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">No ADC3 source or battery-rail readback</text>
<text x="60" y="1012" font-size="18" fill="#a95018" text-anchor="start" font-weight="normal">VSH = IN+ - IN-. Correct current only; do not subtract current baseline from voltage. Refresh baselines after the wiring change.</text>
<rect x="30" y="1070" width="750" height="360" rx="7" fill="#f5f8f8" stroke="#cbd7db" stroke-width="1.3"/>
<text x="50" y="1102" font-size="21" fill="#172b3a" text-anchor="start" font-weight="bold">Logic / I2C / breakout wiring</text>
<text x="55" y="1135" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">INA VCC -&gt; Pico 3V3; INA GND -&gt; Pico GND.</text>
<text x="55" y="1168" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">SDA -&gt; GP18 / pin 24; SCL -&gt; GP19 / pin 25.</text>
<text x="55" y="1201" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Breakout pull-ups already fitted; no external pull-ups.</text>
<text x="55" y="1234" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">A1/A0: drain = 3V3/GND; gate = GND/3V3.</text>
<text x="55" y="1267" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">100nF at each INA supply; ALE / ALERT unused.</text>
<text x="55" y="1300" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Each INA VBUS joins its IN+ (not Pico USB VBUS).</text>
<text x="55" y="1333" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">VSYS / pin 39 and VBUS / pin 40 are not analog rails.</text>
<text x="55" y="1366" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">3.3 V is nominal, not a precision voltage reference.</text>
<rect x="810" y="1070" width="760" height="360" rx="7" fill="#f5f8f8" stroke="#cbd7db" stroke-width="1.3"/>
<text x="830" y="1102" font-size="21" fill="#172b3a" text-anchor="start" font-weight="bold">Verification before reconnecting a DUT</text>
<text x="835" y="1135" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">1. Disconnect DUT and probes; leave shunts unbridged.</text>
<text x="835" y="1168" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">2. Confirm source at 3V3 and both feedback bottoms at GND.</text>
<text x="835" y="1201" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">3. Measure VS and switched battery V+; enter actual values.</text>
<text x="835" y="1234" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">4. Check zero PWM: ideal drain near VS, gate near GND.</text>
<text x="835" y="1267" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">5. Recalibrate both drive maps and open-output baselines.</text>
<text x="835" y="1300" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">6. Verify start/stop and controlled soft-reset behavior unloaded.</text>
<text x="835" y="1333" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Relay power removal is not drain/gate isolation.</text>
<text x="835" y="1366" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Power sequencing and hardware current compliance remain open.</text>
<text x="40" y="1475" font-size="18" fill="#a95018" text-anchor="start" font-weight="normal">An unpowered LM358 may load a biased-source DUT through its body diode. Relay delay / rail collapse need separate verification.</text>
<text x="40" y="1528" font-size="16" fill="#526674" text-anchor="start" font-weight="normal">Revision G | Docs 2026-11-03 | Source / module control wiring confirmed; relay internals and power transients unverified</text>
</svg>