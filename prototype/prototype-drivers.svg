<text x="710" y="505" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Ideal: VD_DRV = VS + 6.8 x PWMavg</text>
<text x="60" y="465" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">PWM: 0-3.3 V at 100 kHz; one RC pole.</text>
<text x="60" y="493" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Settle &gt;=100 ms; trigger INA average (default 64).</text>
<text x="60" y="521" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Polarized filter cap: + input node, - GND.</text>
<text x="60" y="549" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">RC ~8.72 ms with R13; R1 = 1k 5% fitted.</text>
<text x="1010" y="392" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">VBUS and feedback are BEFORE the shunt.</text>
<text x="1010" y="420" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Kelvin-connect IN+ / IN- at the shunt.</text>
<text x="1010" y="448" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Software current scale: 0.789 ohm.</text>
<text x="60" y="608" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">U1A: IN+ pin 3; IN- pin 2; OUT pin 1. Supply: pin 8 = switched battery +; pin 4 = GND.</text>
