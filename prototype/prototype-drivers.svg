<text x="710" y="1070" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Ideal: VG_DRV = 7.8 x PWMavg</text>
<text x="60" y="1030" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">PWM: 0-3.3 V at 100 kHz; one RC pole.</text>
<text x="60" y="1058" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Settle &gt;=100 ms; trigger INA average (default 64).</text>
<text x="60" y="1086" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Polarized filter cap: + input node, - GND.</text>
<text x="60" y="1114" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">RC = 10 ms; R6 unchanged, not remeasured.</text>
<text x="1010" y="957" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">VBUS and feedback are BEFORE the shunt.</text>
<text x="1010" y="985" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Kelvin-connect IN+ / IN- at the shunt.</text>
<text x="1010" y="1013" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">Provisional software scale: 638 ohm.</text>
<text x="60" y="1173" font-size="18" fill="#172b3a" text-anchor="start" font-weight="normal">U1B: IN+ pin 5; IN- pin 6; OUT pin 7. Supply: pin 8 = switched battery +; pin 4 = GND.</text>
<text x="60" y="1247" font-size="20" fill="#172b3a" text-anchor="start" font-weight="bold">Pico 3V3(OUT) / physical pin 36</text>
